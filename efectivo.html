<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Ventas efectivo</title>
</head>
<body>
    <h1 class="margin-ventas">ventas en efectivo</h1>

    <div class="contenedorVentas">
        <div class="producto">
            <span class="contador" id="contador-pancho">0</span>
            <button class="contador restador" onclick="decrementarContador('pancho')">-</button>
            <button class="boton producto-boton botonP botonImg" onclick="incrementarContador('pancho')">Pancho</button>
        </div>

        <div class="producto">
            <span class="contador" id="contador-hs">0</span>
            <button class="contador restador" onclick="decrementarContador('hs')">-</button>
            <button class="boton producto-boton botonHS botonImg" onclick="incrementarContador('hs')">Hambur simple</button>
        </div>

        <div class="producto">
            <span class="contador" id="contador-hd">0</span>
            <button class="contador restador" onclick="decrementarContador('hd')">-</button>
            <button class="boton producto-boton botonHD botonImg" onclick="incrementarContador('hd')">Hambur doble</button>
        </div>

        <div class="producto">
            <span class="contador" id="contador-g">0</span>
            <button class="contador restador" onclick="decrementarContador('g')">-</button>
            <button class="boton producto-boton botonG botonImg" onclick="incrementarContador('g')">Gaseosa</button>
        </div>

        <div class="producto">
            <span class="contador" id="contador-gb">0</span>
            <button class="contador restador" onclick="decrementarContador('gb')">-</button>
            <button class="boton producto-boton botonGB botonImg" onclick="incrementarContador('gb')">G. bebé</button>
        </div>

        <div class="producto">
            <span class="contador" id="contador-a">0</span>
            <button class="contador restador" onclick="decrementarContador('a')">-</button>
            <button class="boton producto-boton botonA botonImg" onclick="incrementarContador('a')">Agua</button>
        </div>
    </div>

    <a href="./index.html" class="boton">Cerrar venta</a>

    <script src="app.js"></script>
</body>
</html>
